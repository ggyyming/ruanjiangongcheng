[project]
name = "ruanjiangongcheng"
version = "0.1.0"
description = "软件工程课程项目"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16,<0.17",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

