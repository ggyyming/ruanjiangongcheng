{% extends "base.html" %}
{% block title %}校内身份申请{% endblock %}
{% block content %}
<div class="form-shell">
  <a class="back-link" href="{% url 'accounts:home' %}">← 我的账户</a>
  <header class="page-header"><div><h1>校内身份申请</h1><p class="muted">管理员会核验你填写的信息。无需上传证件照片。</p></div></header>
  <form class="card" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">提交申请</button>
  </form>
</div>
{% endblock %}
