{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="分页">
  {% if page_obj.has_previous %}<a class="button secondary compact" href="{% querystring page=page_obj.previous_page_number %}">上一页</a>{% endif %}
  <span>第 {{ page_obj.number }} 页，共 {{ page_obj.paginator.num_pages }} 页</span>
  {% if page_obj.has_next %}<a class="button secondary compact" href="{% querystring page=page_obj.next_page_number %}">下一页</a>{% endif %}
</nav>
{% endif %}
