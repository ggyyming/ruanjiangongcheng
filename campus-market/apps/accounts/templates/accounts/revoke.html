{% extends "base.html" %}
{% block title %}撤销校内认证{% endblock %}
{% block content %}
<div class="form-shell">
  <a class="back-link" href="{% url 'accounts:review_list' %}">← 身份审核</a>
  <header class="page-header"><div><h1>撤销校内认证</h1><p class="muted">用户：{{ target.username }}</p></div></header>
  <p class="notice warn">撤销后，该用户未预留的物品将下架，已有流转仍可继续。用户须重新通过审核才能发布或申请物品。</p>
  <form class="card" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions"><button class="danger" type="submit">确认撤销</button><a class="button secondary" href="{% url 'accounts:review_list' %}">返回审核列表</a></div>
  </form>
</div>
{% endblock %}
